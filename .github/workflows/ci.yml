name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check fplpredict tests scripts
      - run: PYTHONPATH=. pytest tests/ -q --cov=fplpredict --cov-report=term-missing

  data-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pytest>=8.0"
      - name: Validate exported site JSON
        run: PYTHONPATH=. pytest tests/test_export_contract.py -q
      - name: Warn when site data is stale
        run: |
          python - <<'EOF'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("web/public/data/pipeline_status.json")
          if not path.exists():
              print("::warning::pipeline_status.json is missing; run the weekly pipeline.")
              raise SystemExit(0)
          status = json.loads(path.read_text(encoding="utf-8"))
          run_at = datetime.fromisoformat(status["runAt"])
          age = (datetime.now(timezone.utc) - run_at).days
          if age > 9:
              print(f"::warning::Site data is {age} days old (last weekly run {run_at:%Y-%m-%d}).")
          failed = [lg["name"] for lg in status.get("leagues", []) if lg.get("status") != "ok"]
          if failed:
              print(f"::warning::Last weekly run failed for: {', '.join(failed)}")
          EOF

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
